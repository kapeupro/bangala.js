<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.15"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Accent top line -->
  <rect x="0" y="0" width="1200" height="3" fill="#f97316"/>

  <!-- Logo mark (centered around x=600, shifted left to balance with text) -->
  <g transform="translate(440, 185) scale(2.8)">
    <ellipse cx="26" cy="104" rx="16" ry="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
    <ellipse cx="54" cy="104" rx="16" ry="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="18" y="52" width="44" height="52" rx="3" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <rect x="31" y="76" width="18" height="28" rx="3" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.2"/>
    <path d="M12 54 C12 54 12 8 40 2 C68 8 68 54 68 54 Z" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <path d="M16 54 Q40 50 64 54" stroke="#f97316" stroke-width="1.5" fill="none"/>
    <rect x="50" y="2" width="9" height="15" rx="2" fill="none" stroke="#f97316" stroke-width="1.3"/>
    <rect x="48" y="0" width="13" height="5" rx="2" fill="#f97316" fill-opacity="0.4" stroke="#f97316" stroke-width="1.2"/>
  </g>

  <!-- Wordmark -->
  <text
    x="600"
    y="310"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-3"
  >bangala<tspan fill="#f97316">.</tspan>js</text>

  <!-- Tagline -->
  <text
    x="600"
    y="378"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="400"
    text-anchor="middle"
    fill="#a1a1aa"
    letter-spacing="0.5"
  >The full-stack framework that ships minimal JavaScript.</text>

  <!-- Divider -->
  <line x1="480" y1="410" x2="720" y2="410" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Sub-tagline -->
  <text
    x="600"
    y="444"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="400"
    text-anchor="middle"
    fill="#71717a"
    letter-spacing="2"
  >HTML-FIRST · ISLANDS ARCHITECTURE · ZERO RUNTIME</text>

  <!-- Version pill (bottom-right) -->
  <rect x="1074" y="574" width="96" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1" stroke-opacity="0.6"/>
  <text
    x="1122"
    y="595"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#f97316"
  >v0.4.0</text>

  <!-- bangala.eu domain (bottom-left) -->
  <text
    x="30"
    y="595"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="400"
    fill="#52525b"
  >bangala.eu</text>
</svg>
